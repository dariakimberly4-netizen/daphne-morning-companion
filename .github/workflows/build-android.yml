name: Build Daphne Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Get app source
        uses: actions/checkout@v4
      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android project files
        run: flutter create --platforms=android --org com.kimberlydaria .
      - name: Install Flutter packages
        run: flutter pub get
      - name: Build release APK
        run: flutter build apk --release
      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: daphne-morning-companion-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
      - name: Publish easy-download release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: Daphne Morning Companion
          body: Install Daphne on Jasmin's Android phone. Download app-release.apk below.
          make_latest: true
          files: build/app/outputs/flutter-apk/app-release.apk
