name: Build Daphne Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Get app source
        uses: actions/checkout@v4
      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android project files
        run: flutter create --platforms=android --org com.kimberlydaria .
      - name: Install Flutter packages
        run: flutter pub get
      - name: Build OPPO A3 arm64 APK
        run: |
          flutter build apk --release --target-platform android-arm64
          cp build/app/outputs/flutter-apk/app-release.apk daphne-oppo-a3.apk
      - name: Verify APK archive and signature
        run: |
          unzip -t daphne-oppo-a3.apk
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)"
          "$APKSIGNER" verify --verbose --print-certs daphne-oppo-a3.apk
      - name: Upload verified OPPO APK
        uses: actions/upload-artifact@v4
        with:
          name: daphne-oppo-a3-apk
          path: daphne-oppo-a3.apk
          retention-days: 30
      - name: Publish easy-download release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: Daphne Morning Companion
          body: For Jasmin's OPPO A3 CPH2669 on Android 14, download daphne-oppo-a3.apk.
          make_latest: true
          files: daphne-oppo-a3.apk
