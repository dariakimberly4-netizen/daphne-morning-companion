name: Build Daphne Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Get app source
        uses: actions/checkout@v4
      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android project files
        run: flutter create --platforms=android --org com.kimberlydaria .
      - name: Install Flutter packages
        run: flutter pub get
      - name: Build standard release APK
        run: flutter build apk --release
      - name: Build compatibility APK
        run: |
          flutter build apk --debug
          cp build/app/outputs/flutter-apk/app-debug.apk daphne-compatible.apk
      - name: Verify APK files
        run: |
          unzip -t build/app/outputs/flutter-apk/app-release.apk
          unzip -t daphne-compatible.apk
      - name: Upload installable APKs
        uses: actions/upload-artifact@v4
        with:
          name: daphne-morning-companion-apks
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            daphne-compatible.apk
          retention-days: 30
      - name: Publish easy-download release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: Daphne Morning Companion
          body: Download daphne-compatible.apk if Android reports a parsing problem with the standard APK.
          make_latest: true
          files: |
            build/app/outputs/flutter-apk/app-release.apk
            daphne-compatible.apk
